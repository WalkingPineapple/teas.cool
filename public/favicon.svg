<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="teas.cool">
  <path class="steam steam-left" d="M27.2 22.6c-4.4-4.7 4.3-7.1 1.1-12.1" />
  <path class="steam steam-right" d="M37.2 21.9c3.9-4.1-3-6.4 1.3-11.7" />
  <path class="leaf" d="M32.5 14.8c3.2-6.1 8.6-7.6 14.2-4.9-1.3 6.7-6.7 9.5-14.2 4.9Z" />
  <path class="lid" d="M18.7 30.5c3.7-5.1 8.3-7.6 13.3-7.6s9.6 2.5 13.3 7.6" />
  <path class="knob" d="M28.8 23.3c.9-1.8 2-2.8 3.2-2.8s2.3 1 3.2 2.8" />
  <path class="rim" d="M15.5 35.4h33" />
  <path class="tea-line" d="M22.2 39.2c6.3 1.7 13.3 1.7 19.6 0" />
  <path class="bowl" d="M18.3 36.7c2 9 7.2 14.2 13.7 14.2s11.7-5.2 13.7-14.2H18.3Z" />
  <path class="foot" d="M25.2 52.7h13.6" />
  <path class="saucer" d="M13.7 55.4c6.1 3.4 30.5 3.4 36.6 0" />
  <style>
    .steam,
    .lid,
    .knob,
    .rim,
    .tea-line,
    .foot,
    .saucer {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .steam {
      stroke: #a87835;
      stroke-width: 3.2;
    }

    .lid,
    .knob,
    .rim,
    .foot,
    .saucer {
      stroke: #2f513f;
      stroke-width: 3.1;
    }

    .tea-line {
      stroke: #d2a35a;
      stroke-width: 2.1;
      opacity: 0.9;
    }

    .leaf,
    .bowl {
      fill: #2f513f;
    }

    .bowl {
      fill-rule: evenodd;
    }

    @media (prefers-color-scheme: dark) {
      .steam,
      .tea-line {
        stroke: #d2a35a;
      }

      .lid,
      .knob,
      .rim,
      .foot,
      .saucer {
        stroke: #9bb38d;
      }

      .leaf,
      .bowl {
        fill: #9bb38d;
      }
    }
  </style>
</svg>
